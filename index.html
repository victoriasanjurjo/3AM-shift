<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Shift 03:00 AM - Taller Nocturno</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #111418;
      color: #e0e6ed;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 3px solid #2d3748;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background: #0f1115;
    }
    canvas { display: block; }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 600px;
      padding: 10px 15px;
      background: #1a202c;
      border-bottom: 2px solid #2d3748;
      font-size: 14px;
      font-weight: bold;
      color: #38bdf8;
    }
    .instructions {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      max-width: 600px;
      line-height: 1.4;
    }
    .keys {
      display: inline-block;
      background: #334155;
      color: #f8fafc;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div id="shift-time">TURNO: 03:00 AM</div>
      <div id="score">PIEZAS CLASIFICADAS: 0</div>
      <div id="fails">FALLOS: 0 / 3</div>
    </div>
    <canvas id="canvas" width="600" height="420"></canvas>
  </div>

  <div class="instructions">
    Usa las teclas de flecha o los números para clasificar la pieza que llega al sensor:<br>
    <span class="keys">← Izquierda (1)</span>: <b>DESCARTE (Oxidado/Quemado)</b> | 
    <span class="keys">↓ Abajo (2)</span>: <b>RECICLAJE (Metales limpios)</b> | 
    <span class="keys">→ Derecha (3)</span>: <b>REPUESTOS (Engranajes útiles)</b>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const timeDisplay = document.getElementById('shift-time');
const scoreDisplay = document.getElementById('score');
const failsDisplay = document.getElementById('fails');

let score = 0;
let fails = 0;
let maxFails = 3;
let gameOver = false;
let victory = false;

// Reloj del turno: de 03:00 AM a 06:00 AM (dura unos 3 a 5 minutos)
let currentMinutes = 3 * 60; // 180 min
const endMinutes = 6 * 60;   // 360 min
const timeSpeed = 0.08;      // ritmo de avance

// Definición de tipos de piezas y su destino correcto:
// 0: Descarte (Izquierda)
// 1: Reciclaje (Abajo)
// 2: Repuesto Útil (Derecha)
const PIECE_TYPES = [
  { name: 'Engranaje Impecable', color: '#38bdf8', shape: 'gear', bin: 2, label: 'UTIL' },
  { name: 'Tuerca Oxidadisima', color: '#b45309', shape: 'bolt', bin: 0, label: 'OXIDO' },
  { name: 'Lámina de Cobre Limpia', color: '#f59e0b', shape: 'plate', bin: 1, label: 'RECICLAR' },
  { name: 'Fusible Quemado', color: '#475569', shape: 'fuse', bin: 0, label: 'QUEMADO' },
  { name: 'Biela Rectificada', color: '#10b981', shape: 'rod', bin: 2, label: 'UTIL' },
  { name: 'Viruta de Aluminio', color: '#94a3b8', shape: 'plate', bin: 1, label: 'RECICLAR' }
];

let conveyorItems = [];
let spawnTimer = 0;
let spawnInterval = 130;
const beltSpeed = 1.4;
const checkPointX = 300; // Donde se evalúa la pieza

function spawnPiece() {
  const template = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  conveyorItems.push({
    ...template,
    x: 40,
    y: 190,
    active: true
  });
}

// Dibujar una pieza según su forma
function drawPiece(item) {
  ctx.save();
  ctx.translate(item.x, item.y);
  ctx.fillStyle = item.color;
  ctx.strokeStyle = '#f8fafc';
  ctx.lineWidth = 2;

  if (item.shape === 'gear') {
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#0f1115';
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
  } else if (item.shape === 'bolt') {
    ctx.fillRect(-14, -14, 28, 28);
    ctx.strokeRect(-14, -14, 28, 28);
  } else if (item.shape === 'plate') {
    ctx.fillRect(-20, -10, 40, 20);
    ctx.strokeRect(-20, -10, 40, 20);
  } else if (item.shape === 'fuse') {
    ctx.fillRect(-18, -6, 36, 12);
    ctx.strokeRect(-18, -6, 36, 12);
  } else if (item.shape === 'rod') {
    ctx.beginPath();
    ctx.roundRect(-22, -8, 44, 16, 8);
    ctx.fill();
    ctx.stroke();
  }

  // Etiqueta de la pieza
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(item.label, 0, -22);

  ctx.restore();
}

function processClassification(chosenBin) {
  if (gameOver || victory) return;

  // Buscar la pieza más cercana a la zona de escaneo
  let targetIndex = -1;
  let minDistance = 999;

  for (let i = 0; i < conveyorItems.length; i++) {
    const dist = Math.abs(conveyorItems[i].x - checkPointX);
    if (dist < 60 && dist < minDistance) {
      minDistance = dist;
      targetIndex = i;
    }
  }

  if (targetIndex !== -1) {
    const item = conveyorItems[targetIndex];
    if (item.bin === chosenBin) {
      score += 1;
      conveyorItems.splice(targetIndex, 1);
    } else {
      fails += 1;
      conveyorItems.splice(targetIndex, 1);
    }
  } else {
    // Clasificó al aire sin pieza en el sensor
    fails += 1;
  }

  updateHUD();
  checkConditions();
}

function updateHUD() {
  const h = Math.floor(currentMinutes / 60);
  const m = Math.floor(currentMinutes % 60);
  const timeStr = `0${h}:${m < 10 ? '0' : ''}${m} AM`;
  timeDisplay.innerText = `TURNO: ${timeStr}`;
  scoreDisplay.innerText = `PIEZAS CLASIFICADAS: ${score}`;
  failsDisplay.innerText = `FALLOS: ${fails} / ${maxFails}`;
}

function checkConditions() {
  if (fails >= maxFails) {
    gameOver = true;
  }
  if (currentMinutes >= endMinutes) {
    victory = true;
  }
}

// Controles de teclado
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === '1') {
    processClassification(0);
  } else if (e.key === 'ArrowDown' || e.key === '2') {
    processClassification(1);
  } else if (e.key === 'ArrowRight' || e.key === '3') {
    processClassification(2);
  } else if ((e.key === 'r' || e.key === 'R') && (gameOver || victory)) {
    location.reload();
  }
});

function update() {
  if (gameOver || victory) return;

  // Avance del tiempo
  currentMinutes += timeSpeed;
  if (Math.floor(currentMinutes) % 5 === 0) updateHUD();

  // Generador de piezas
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnPiece();
    spawnTimer = 0;
  }

  // Movimiento en la cinta transportadora
  for (let i = conveyorItems.length - 1; i >= 0; i--) {
    conveyorItems[i].x += beltSpeed;

    // Si la pieza se cae de la cinta sin clasificar
    if (conveyorItems[i].x > canvas.width - 20) {
      conveyorItems.splice(i, 1);
      fails += 1;
      updateHUD();
      checkConditions();
    }
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Fondo y cinta
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 160, canvas.width, 60);

  // Marcas de la cinta
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 3;
  for (let x = 0; x < canvas.width; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, 160);
    ctx.lineTo(x + 10, 220);
    ctx.stroke();
  }

  // Zona del sensor óptico
  ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
  ctx.fillRect(checkPointX - 35, 120, 70, 140);
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 1;
  ctx.strokeRect(checkPointX - 35, 120, 70, 140);
  ctx.fillStyle = '#38bdf8';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SENSOR', checkPointX, 140);

  // Contenedores inferiores
  // 1. Descarte
  ctx.fillStyle = '#1e1b18';
  ctx.strokeStyle = '#b45309';
  ctx.strokeRect(40, 280, 140, 100);
  ctx.fillRect(40, 280, 140, 100);
  ctx.fillStyle = '#f59e0b';
  ctx.fillText('← [1] DESCARTE', 110, 310);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('(Oxidado / Quemado)', 110, 335);

  // 2. Reciclaje
  ctx.fillStyle = '#131b20';
  ctx.strokeStyle = '#0284c7';
  ctx.strokeRect(230, 280, 140, 100);
  ctx.fillRect(230, 280, 140, 100);
  ctx.fillStyle = '#38bdf8';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('↓ [2] RECICLAJE', 300, 310);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('(Metal Limpio)', 300, 335);

  // 3. Repuesto Útil
  ctx.fillStyle = '#13211c';
  ctx.strokeStyle = '#059669';
  ctx.strokeRect(420, 280, 140, 100);
  ctx.fillRect(420, 280, 140, 100);
  ctx.fillStyle = '#34d399';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('→ [3] REPUESTO', 490, 310);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('(Piezas Útiles)', 490, 335);

  // Dibujar piezas
  conveyorItems.forEach(drawPiece);

  // Pantallas de fin de juego
  if (gameOver) {
    ctx.fillStyle = 'rgba(15, 17, 21, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TURNO CANCELADO - DEMASIADOS FALLOS', canvas.width / 2, 190);
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '14px monospace';
    ctx.fillText(`Clasificaste ${score} piezas antes del colapso.`, canvas.width / 2, 225);
    ctx.fillText('Presiona [R] para volver a intentarlo.', canvas.width / 2, 260);
  } else if (victory) {
    ctx.fillStyle = 'rgba(15, 17, 21, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('¡TURNO COMPLETADO! SON LAS 06:00 AM', canvas.width / 2, 190);
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '14px monospace';
    ctx.fillText(`Excelente trabajo: ${score} piezas procesadas limpiamente.`, canvas.width / 2, 225);
    ctx.fillText('Presiona [R] para iniciar otro turno.', canvas.width / 2, 260);
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// Iniciar primer item
spawnPiece();
gameLoop();
</script>
</body>
</html>
